<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>NEXZORA – Smart Water Purification &amp; Monitoring</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f2f8fc;--card:#fff;--ink:#0b2540;--muted:#5a7089;--line:#dfeaf3;--blue:#0a6cff;--blue-d:#0850c2;--blue-l:#e5f0ff;--green:#12a150;--green-l:#e1f6e9;--amber:#c27a00;--amber-l:#fff2d3;--red:#d92d3a;--red-l:#fde7e9;--shadow:0 1px 3px rgba(10,60,120,.08),0 6px 18px rgba(10,60,120,.06);--nav:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06121e;--card:#0d2133;--ink:#e7f1fa;--muted:#8da6bd;--line:#1a3550;--blue:#4b97ff;--blue-d:#7bb2ff;--blue-l:#0f2f57;--green:#34c77c;--green-l:#0e3523;--amber:#f0b429;--amber-l:#3a2d0a;--red:#ff6b75;--red-l:#42191e;--shadow:0 1px 3px rgba(0,0,0,.4);--nav:#0a1b2b}}
:root[data-theme="dark"]{--bg:#06121e;--card:#0d2133;--ink:#e7f1fa;--muted:#8da6bd;--line:#1a3550;--blue:#4b97ff;--blue-d:#7bb2ff;--blue-l:#0f2f57;--green:#34c77c;--green-l:#0e3523;--amber:#f0b429;--amber-l:#3a2d0a;--red:#ff6b75;--red-l:#42191e;--shadow:0 1px 3px rgba(0,0,0,.4);--nav:#0a1b2b}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:500px){#app{border-inline:1px solid var(--line);box-shadow:0 0 40px rgba(10,60,120,.12)}}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff;background:linear-gradient(120deg,#0a5fe0 0%,#0a86c8 60%,#12a150 135%)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em;font-size:17px;flex:1;min-width:0}
.brand svg{flex:none}
.tchip{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip.off{background:#ffb02e;color:#3a2500}
.avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--blue-d);font-weight:800;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.main{flex:1;overflow-y:auto;padding:14px 14px 22px;-webkit-overflow-scrolling:touch}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav);border-top:1px solid var(--line)}
.nav button{background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.nav button.on{color:var(--blue)}
.nav button.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--blue)}
.badge{position:absolute;top:3px;left:calc(50% + 7px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}
.ic{flex:none;vertical-align:middle}
h2{font-size:19px;margin:0}h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.sub{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sub h2{flex:1}
.iconbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer;min-height:44px}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.amber{background:#e0a21a;color:#2b1c00}
.btn.ghost{background:var(--blue-l);color:var(--blue-d)}.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}.btn.block{width:100%}
.btn:disabled,.btn.dis{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.iconbtn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:12.5px}.b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--blue-l);color:var(--blue-d);white-space:nowrap}
.chip.ok{background:var(--green-l);color:var(--green)}.chip.warn{background:var(--amber-l);color:var(--amber)}.chip.bad{background:var(--red-l);color:var(--red)}.chip.gray{background:var(--line);color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center}
.tank{--wv:#2b8cff;width:84px;height:116px;flex:none;border-radius:22px 22px 28px 28px;border:3px solid var(--line);position:relative;overflow:hidden;background:var(--blue-l)}
.tank.green{--wv:#1fb866}.tank.red{--wv:#e5484d}.tank.amber{--wv:#e0a21a}
.tank .fill{position:absolute;left:0;right:0;bottom:0;background:var(--wv);transition:height .5s}
.tank .fill::before{content:'';position:absolute;left:0;right:0;top:-7px;height:14px;background:radial-gradient(circle at 10px 14px,var(--wv) 9px,transparent 10px) repeat-x;background-size:20px 14px}
.tank.run .fill::before{animation:wv 1.6s linear infinite}
@keyframes wv{to{background-position-x:20px}}
.tank .pc{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--ink);mix-blend-mode:normal;text-shadow:0 0 6px var(--card)}
.supply{border-radius:14px;padding:11px 13px;font-weight:800;display:flex;align-items:center;gap:9px;margin-top:10px;line-height:1.25}
.supply.SAFE{background:var(--green-l);color:var(--green)}.supply.UNSAFE,.supply.BLOCKED{background:var(--red-l);color:var(--red)}.supply.PENDING{background:var(--amber-l);color:var(--amber)}.supply.OVERRIDE{background:var(--amber-l);color:var(--amber)}
.pipe{display:flex;margin:2px 0 14px;padding:12px 4px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.pp{flex:1;position:relative;text-align:center;min-width:0}
.pp .pc{width:26px;height:26px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;background:var(--line);color:var(--muted);position:relative;z-index:1}
.pp em{font-style:normal;font-size:10px;line-height:1.15;display:block;color:var(--muted);font-weight:600;padding:0 1px}
.pp:not(:last-child)::after{content:'';position:absolute;top:12px;left:calc(50% + 14px);right:calc(-50% + 14px);height:3px;border-radius:2px;background:var(--line)}
.pp.done::after{background:var(--blue)}
.pp.done .pc{background:var(--blue);color:#fff}.pp.active .pc{background:var(--blue-l);color:var(--blue);box-shadow:0 0 0 3px var(--blue)}.pp.active em,.pp.done em{color:var(--ink)}
.pp.safe .pc{background:var(--green);color:#fff}.pp.unsafe .pc,.pp.fail .pc{background:var(--red);color:#fff}.pp.warn .pc{background:#e0a21a;color:#2b1c00}
.pp.active .pc i{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{transform:scale(.45);opacity:.5}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);border-left:5px solid var(--green)}
.tile.s-warn{border-left-color:#e0a21a}.tile.s-bad,.tile.s-fault{border-left-color:var(--red)}
.tile .tl{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13px}
.tile .tv{display:flex;align-items:baseline;gap:4px;margin:4px 0 8px}.tile .tv b{font-size:26px;font-weight:800;letter-spacing:-.02em}.tile .tv small{color:var(--muted);font-size:12px}
.bar{position:relative;height:6px;border-radius:4px;background:var(--line)}
.bar .band{position:absolute;top:0;bottom:0;background:var(--green);opacity:.35;border-radius:4px}
.bar .dot{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ink);border:2px solid var(--card);transition:left .5s}
.tile .ts{font-size:12px;margin-top:7px;font-weight:700}
.tile.s-ok .ts{color:var(--green)}.tile.s-warn .ts{color:var(--amber)}.tile.s-bad .ts,.tile.s-fault .ts{color:var(--red)}
.kv{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv .k{flex:1;min-width:0}.kv .k small{display:block;color:var(--muted)}
.li{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.li .lc{flex:1;min-width:0}.li small{display:block;color:var(--muted)}
.li .ib{width:38px;height:38px;border-radius:12px;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;flex:none}
.stg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.stg:last-child{border:0}
.stg .sn{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:var(--muted)}
.stg.active .sn{background:var(--blue);color:#fff}.stg.done .sn{background:var(--green);color:#fff}
.stg .sb{flex:1;min-width:0}.stg .sb small{display:block;color:var(--muted);line-height:1.3}
.pb{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .4s linear}
.pb.big{height:10px}.pb.g i{background:var(--green)}
.alert{border-radius:14px;border:1px solid var(--line);background:var(--card);padding:12px;margin-bottom:10px;border-left:5px solid var(--amber)}
.alert.critical{border-left-color:var(--red)}.alert.resolved{opacity:.7;border-left-color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:700;background:var(--bg)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:12px;font-weight:600;font-size:13.5px}
.banner.warn{background:var(--amber-l);color:var(--amber)}.banner.info{background:var(--blue-l);color:var(--blue-d)}.banner.bad{background:var(--red-l);color:var(--red)}
label.f{display:block;margin-bottom:10px;font-weight:600;font-size:13px}label.f span{display:block;margin-bottom:4px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;min-height:44px}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:10px}.sw input{width:22px;height:22px;min-height:0}
pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto;font-size:11.5px;max-height:260px;margin:8px 0}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;background:var(--card)}summary{cursor:pointer;font-weight:700}
.sheetbg{position:fixed;inset:0;background:rgba(5,20,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:440px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:17px;margin-bottom:12px}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:420px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.ok{background:var(--green);color:#fff}.toast.bad{background:var(--red);color:#fff}.toast.warn{background:#e0a21a;color:#2b1c00}
.login{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.login .hd{padding:42px 24px 30px;color:#fff;background:linear-gradient(150deg,#0a5fe0 0%,#0a86c8 62%,#12a150 130%)}
.login .hd h1{margin:14px 0 4px;font-size:30px;letter-spacing:.03em}.login .hd p{margin:0;opacity:.92;font-size:14px}
.login .bd{padding:20px 18px 28px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--blue-l);border-top-color:var(--blue);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.lockrow{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-top:8px}
.spark{display:block;width:100%;height:34px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tile.s-nodata{border-left-color:var(--line)}.tile.s-nodata .ts{color:var(--muted)}
.tchip .sr{display:none}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* =====================================================================
   NEXZORA – core logic (database, auth, RBAC, analysis, purification,
   alerts, devices, offline sync). UI lives in ui.js.
   ===================================================================== */
const G = typeof window !== 'undefined' ? window : globalThis;
const now = () => Date.now();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (v, d = 1) => (v == null || typeof v !== 'number' || isNaN(v)) ? '—' : v.toFixed(d);
const pad = n => String(n).padStart(2, '0');
const nz = a => (Math.random() - 0.5) * 2 * a;
const clone = o => JSON.parse(JSON.stringify(o));
function fdate(ts) { const d = new Date(ts); return d.toLocaleDateString([], { day: '2-digit', month: 'short' }) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function ago(ts) { if (!ts) return 'never'; const s = Math.round((now() - ts) / 1000); if (s < 5) return 'just now'; if (s < 60) return s + 's ago'; if (s < 3600) return Math.round(s / 60) + 'm ago'; if (s < 86400) return Math.round(s / 3600) + 'h ago'; return Math.round(s / 86400) + 'd ago'; }
function hash(str) { // cyrb53 – DEMO-GRADE ONLY. Production: bcrypt/argon2 on the server.
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}
class AppError extends Error { }

/* ---------- safe storage (localStorage with in-memory fallback) ---------- */
const mem = {};
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v == null ? (mem[k] ?? null) : v; } catch (e) { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) { } },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { } }
};
const KEY_DB = 'nexzora_edge_db_v1', KEY_CLOUD = 'nexzora_cloud_v1', KEY_SESS = 'nexzora_session_v1', KEY_THEME = 'nexzora_theme', KEY_MODE = 'nexzora_mode';
const dbKey = m => m === 'demo' ? KEY_DB : 'nexzora_edge_db_real_v1', cloudKey = m => m === 'demo' ? KEY_CLOUD : 'nexzora_cloud_real_v1';

/* ---------- database schema (also drives the SQL DDL shown in the app) ---------- */
const SCHEMA = {
  roles: 'id:pk,key:text,name:text,permissions:json',
  users: 'id:pk,name:text,email:text,pass_hash:text,salt:text,role_id:fk>roles,active:bool,last_login:ts,created_at:ts',
  locations: 'id:pk,name:text,source_type:text,lat:real,lng:real,address:text',
  devices: 'id:pk,code:text,name:text,location_id:fk>locations,mode:text,status:text,firmware:text,last_seen:ts,created_at:ts',
  device_components: 'id:pk,device_id:fk>devices,type:text,status:text,value:text,note:text,updated_at:ts',
  sensor_readings: 'id:pk,device_id:fk>devices,location_id:fk>locations,ts:ts,point:text,ph:real,tds:real,turbidity:real,temperature:real,battery_pct:real,online:bool,synced:bool',
  water_analysis: 'id:pk,device_id:fk>devices,location_id:fk>locations,user_id:fk>users,ts:ts,readings:json,conditions:json,summary:text,source_type:text,synced:bool',
  treatment_selections: 'id:pk,analysis_id:fk>water_analysis,seq:int,treatment_key:text,name:text,selected:bool,basis:text,reason:text,synced:bool',
  purification_sessions: 'id:pk,analysis_id:fk>water_analysis,device_id:fk>devices,started_by:fk>users,state:text,progress:real,stage_idx:int,started_at:ts,ended_at:ts,end_reason:text,synced:bool',
  final_water_results: 'id:pk,session_id:fk>purification_sessions,ts:ts,readings:json,checks:json,verdict:text,supply:text,override_by:fk>users,override_reason:text,synced:bool',
  alerts: 'id:pk,type:text,severity:text,device_id:fk>devices,message:text,value:text,status:text,created_at:ts,ack_by:fk>users,ack_at:ts,resolved_by:fk>users,resolved_at:ts,note:text,synced:bool',
  maintenance_records: 'id:pk,device_id:fk>devices,component:text,kind:text,title:text,description:text,status:text,assigned_to:fk>users,created_by:fk>users,created_at:ts,completed_at:ts,alert_id:fk>alerts,synced:bool',
  audit_logs: 'id:pk,ts:ts,user_id:fk>users,action:text,detail:text,result:text,synced:bool'
};
const PFX = { roles: 'role', users: 'usr', locations: 'loc', devices: 'dev', device_components: 'cmp', sensor_readings: 'rd', water_analysis: 'wa', treatment_selections: 'tsel', purification_sessions: 'ps', final_water_results: 'fw', alerts: 'al', maintenance_records: 'mt', audit_logs: 'au' };
const SYNC_TABLES = ['sensor_readings', 'water_analysis', 'treatment_selections', 'purification_sessions', 'final_water_results', 'alerts', 'maintenance_records', 'audit_logs'];
function ddl() {
  const mp = { text: 'TEXT', int: 'INTEGER', real: 'REAL', bool: 'BOOLEAN', ts: 'TIMESTAMPTZ', json: 'JSONB' };
  return Object.entries(SCHEMA).map(([t, cols]) => `CREATE TABLE ${t} (\n` + cols.split(',').map(c => {
    const [n, ty] = c.split(':');
    if (ty === 'pk') return `  ${n} TEXT PRIMARY KEY`;
    if (ty.startsWith('fk>')) return `  ${n} TEXT REFERENCES ${ty.slice(3)}(id)`;
    return `  ${n} ${mp[ty]}`;
  }).join(',\n') + '\n);').join('\n\n');
}

/* ---------- roles & permissions ---------- */
const PERMS = {
  'dashboard.view': 'View dashboard', 'quality.view': 'View sensor readings & water quality',
  'analysis.run': 'Run water analysis & enter lab values', 'purify.view': 'View purification status',
  'purify.control': 'Start / pause / stop purification', 'supply.override': 'Override a supply block (audited)',
  'alerts.view': 'View alerts', 'alerts.ack.water': 'Acknowledge water-quality alerts', 'alerts.resolve.water': 'Resolve water-quality alerts',

function confirmBox(title, msg, okLabel, act, a, cls = '') { openModal(title, `<p class="muted" style="margin-top:0">${msg}</p><div class="row"><button class="btn line" style="flex:1" data-act="closeModal">Cancel</button><button class="btn ${cls}" style="flex:1" data-act="${act}" data-a="${esc(a || '')}">${okLabel}</button></div>`); }
const fld = (id, label, type = 'text', val = '', extra = '') => `<label class="f"><span>${label}</span><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></label>`;
const sel = (id, label, opts, val) => `<label class="f"><span>${label}</span><select id="${id}">${opts.map(([v, t]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;

const locked = (why) => `<div class="lockrow">${ic('lock', 16)} ${why}</div>`;

/* ---------- derived status ---------- */
function pipeStates() {
  const a = runtime.analysis, s = curSession(), an = curAnalysis(), T = 'todo', st = [T, T, T, T, T, T];
  if (a) { st[0] = a.step === 0 ? 'active' : 'done'; st[1] = a.step < 1 ? T : a.step === 1 ? 'active' : 'done'; st[2] = a.step >= 2 ? 'active' : T; return st; }
  if (!an) return st; st[0] = st[1] = st[2] = 'done';
  if (!s || s.analysis_id !== an.id) return st;
  if (s.state === 'running' || s.state === 'paused') st[3] = 'active';
  else if (s.state === 'final_check') { st[3] = 'done'; st[4] = 'active'; }
  else if (s.state === 'stopped' || s.state === 'failed') st[3] = 'fail';
  else { st[3] = st[4] = 'done'; const f = finalOf(s); st[5] = f && f.override_by ? 'warn' : f && f.verdict === 'SAFE' ? 'safe' : 'unsafe'; }
  return st;
}
function pipeHTML() {
  const N = ['Raw water', 'Sensor analysis', 'Treatment selection', 'Purification', 'Final water test', 'Safe / Unsafe'], st = pipeStates();
  const icn = { done: ic('check', 14), safe: ic('check', 14), unsafe: ic('x', 14), fail: ic('x', 14), warn: ic('warn', 14), active: '<i></i>', todo: '' };
  return `<div class="pipe" role="list" aria-label="Purification flow">${N.map((n, i) => `<div class="pp ${st[i]}" role="listitem"><span class="pc">${icn[st[i]]}</span><em>${n}</em></div>`).join('')}</div>`;
}
function purifyStatus() {
  const a = runtime.analysis, s = curSession(), an = curAnalysis();
  if (a) return { label: 'Analysing water…', tone: 'blue' };
  if (s && s.state === 'running') return { label: `Purifying – stage ${Math.min(s.stage_idx + 1, s.stages.length)}/${s.stages.length}`, tone: 'blue' };
  if (s && s.state === 'paused') return { label: 'Paused', tone: 'amber' };
  if (s && s.state === 'final_check') return { label: 'Final water test', tone: 'blue' };
  if (an && (!s || s.analysis_id !== an.id)) return { label: 'Treatment plan ready', tone: 'blue' };
  if (s && s.state === 'stopped') return { label: 'Stopped', tone: 'amber' };
  if (s && s.state === 'failed') return { label: 'Purification failed', tone: 'red' };
  if (s && s.state === 'completed') return { label: 'Completed – ' + (finalOf(s) || {}).verdict, tone: 'green' };
  return { label: 'Idle', tone: 'blue' };
}
function tankInfo() {
  const a = runtime.analysis, s = curSession(), ss = supplyStatus();
  if (a) return { pct: Math.min(100, a.t / 6.4 * 100), tone: 'blue', run: true };
  if (s && s.state === 'running') return { pct: s.progress * 100, tone: 'blue', run: true };
  if (s && s.state === 'final_check') return { pct: 100, tone: 'blue', run: true };
  if (s && s.state === 'paused') return { pct: s.progress * 100, tone: 'amber', run: false };
  if (ss.code === 'SAFE') return { pct: 100, tone: 'green', run: false };
  if (ss.code === 'UNSAFE') return { pct: 100, tone: 'red', run: false };
  if (ss.code === 'OVERRIDE') return { pct: 100, tone: 'amber', run: false };
  return { pct: 0, tone: 'blue', run: false };
}
function supplyBox(ss) { const ico = { SAFE: '🟢', UNSAFE: '🔴', BLOCKED: '🔴', PENDING: '🟡', OVERRIDE: '🟠' }[ss.code]; return `<div class="supply ${ss.code}" role="status"><span aria-hidden="true">${ico}</span><div>${ss.label}${ss.ts ? `<div class="small" style="font-weight:600;opacity:.85">Verified ${ago(ss.ts)}</div>` : ''}</div></div>`; }
const eta = s => { const total = s.stages.reduce((x, y) => x + y.dur, 0), done = total * s.progress; return Math.max(0, Math.round((total - done) / db.meta.speed) + (s.state === 'final_check' ? 0 : 3)); };

function tile(k) {

}
function offlineBanner() { return netOnline() ? '' : `<div class="banner warn" role="status">${ic('wifioff', 20)}<div>Offline Mode – sensor data keeps coming in and is saved on this device. <b>${pendingCounts().total}</b> records will sync automatically when internet returns.</div></div>`; }
function sparkline(key, w = 100, h = 34) {
  let pts = live.hist.filter(x => x[key] != null).slice(-40).map(x => x[key]);
  if (pts.length < 2) pts = db.sensor_readings.filter(r => r.device_id === activeDev().id && r.point === 'inlet' && r[key] != null).slice(-40).map(r => r[key]);
  if (pts.length < 2) return '';
  const mn = Math.min(...pts), mx = Math.max(...pts), rg = mx - mn || 1;
  const d = pts.map((v, i) => `${(i / (pts.length - 1) * w).toFixed(1)},${(h - 3 - (v - mn) / rg * (h - 6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(--blue)" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

  CORE.forEach(k => { const v = L ? L[k] : null, S = SENS[k], st = stFor(k, L); setT(`[data-live="${k}"]`, fmt(v, S.dec)); setT(`[data-live="st_${k}"]`, stText(st)); $$(`[data-tile="${k}"]`).forEach(t => t.className = 'tile s-' + st); $$(`[data-dot="${k}"]`).forEach(d => d.style.left = (v == null ? 0 : clamp(v / S.max * 100, 0, 100)) + '%'); });
  setT('[data-live="age"]', L ? ago(L.ts) : '—'); setT('[data-live="age2"]', ago(dev.last_seen));
  const bat = batVal(dev.id) ?? 0, sol = comp(dev.id, 'solar_panel').value; setT('[data-live="bat"]', btxt(dev.id)); setT('[data-live="sol"]', (+sol || 0).toFixed(0)); $$('[data-w="bat"]').forEach(e => e.style.width = bat + '%');
  const ti = tankInfo(); $$('[data-h="tank"]').forEach(e => e.style.height = ti.pct + '%'); setT('[data-live="tankpct"]', ti.pct >= 1 ? Math.round(ti.pct) + '%' : ''); setT('[data-live="pstat"]', purifyStatus().label);
  const a = runtime.analysis; if (a) $$('[data-w="ana"]').forEach(e => e.style.width = Math.min(100, a.t / 6.4 * 100) + '%');
  const s = activeSession();
  if (s) { setT('[data-live="pct"]', Math.round(s.progress * 100) + '%'); setT('[data-live="eta"]', String(eta(s))); $$('[data-w="prog"]').forEach(e => e.style.width = s.progress * 100 + '%'); s.stages.forEach((t, i) => $$(`[data-w="st${i}"]`).forEach(e => e.style.width = (t.state === 'done' ? 100 : t.state === 'active' ? s.stage_elapsed / t.dur * 100 : 0) + '%')); }
}
const formFocused = () => { const e = document.activeElement; return e && /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && $('#app').contains(e); };

}

document.addEventListener('click', e => {
  const bg = e.target.closest('.sheetbg'); if (bg && e.target === bg) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.dataset.act === 'closeBg') return;
  if (el.type === 'checkbox' && el.dataset.act !== 'togglePw' && false) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  const done = r => { if (r !== false) render(); };
  try { const r = fn(el.dataset.a, el.dataset.b, el); if (r && r.then) r.then(done, handleErr); else done(r); } catch (err) { handleErr(err); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen) closeModal(); if (e.key === 'Enter' && !cur() && e.target.closest && e.target.closest('.login') && e.target.tagName === 'INPUT') { ACT.doLogin(); render(); } });
document.addEventListener('change', e => { const t = e.target; if (t && t.dataset && t.dataset.conn) { try { saveConn(t.dataset.conn, { url: t.value }); } catch (err) { } } });
function handleErr(err) { if (err instanceof AppError) toast(err.message, 'bad'); else { console.error(err); toast('Something went wrong: ' + err.message, 'bad'); } render(); }
function applyTheme() { const t = LS.get(KEY_THEME) || 'auto', r = document.documentElement; if (t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t); }

/* ---------- boot ---------- */
G.__onAnalysisDone = () => { if (['home', 'purify'].includes(route.name)) route = { name: 'purify' }; };
G.NEXZORA = { version: '1.0', ingestReading: (deviceId, payload) => ingestReading(deviceId, payload, { source: 'api', force: false }), schema: SCHEMA, ddl };
function boot() {

  addEventListener('pagehide', () => persist(true)); document.addEventListener('visibilitychange', () => { if (document.hidden) persist(true); });
  autoConnect(); render(); setInterval(frame, 500); setInterval(() => { persist(); }, 2000);
}
if (typeof document !== 'undefined' && document.getElementById('app')) boot();
})();
